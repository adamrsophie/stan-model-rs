[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "GPL-3.0-only"
authors = ["Adam R Sophie <adamrsophie@gmail.com>"]
repository = "https://github.com/adamrsophie/stan-model-rs"

keywords = ["stan", "bayesian", "autodiff", "probabilistic-programming", "log-density"]
categories = ["mathematics", "science"]

[workspace.dependencies]
stan-model-rs = { path = "crates/stan-model-rs", version = "0.1.0" }
stan-model-rs-fixtures = { path = "crates/stan-model-rs-fixtures" }
# Pinned to the same revision as stanc-rs, so generated models and this runtime share one copy of
# the stanmath-rs scalar types.
stanmath-rs = { git = "https://github.com/adamrsophie/stanmath-rs", rev = "04dc87184161bf29cbc035a32eb0407b14169900" }
# The stanc-rs compiler and the runtime its generated code targets, at a revision built on the
# same stanmath-rs revision as this workspace. Used only by the stan-model-rs-stanc adapter.
stanc-rs = { git = "https://github.com/adamrsophie/stanc-rs", rev = "02406c58d23933a4322abadc4824e263c6088abf" }
stanc-rs-runtime = { git = "https://github.com/adamrsophie/stanc-rs", rev = "02406c58d23933a4322abadc4824e263c6088abf" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = { version = "0.10", default-features = false, features = ["std_rng"] }
proptest = "1"
nuts-rs = { version = "0.19", default-features = false }
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
float_cmp = "allow"
# Checks are written as `!(x > 0.0)` on purpose: the negated form rejects NaN.
neg_cmp_op_on_partial_ord = "allow"
many_single_char_names = "allow"
