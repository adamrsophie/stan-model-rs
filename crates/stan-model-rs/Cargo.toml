[package]
name = "stan-model-rs"
description = "Rust-native Stan model execution runtime: model contract, data, parameter transforms, log densities and gradients"
readme = "../../README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
stanmath-rs.workspace = true
serde.workspace = true
serde_json.workspace = true
rand.workspace = true
nuts-rs = { workspace = true, optional = true }

[features]
# An adapter that lets the NUTS sampler of the nuts-rs crate draw from any Model.
nuts = ["dep:nuts-rs"]

[dev-dependencies]
stan-model-rs-fixtures.workspace = true
proptest.workspace = true
criterion.workspace = true

[[bench]]
name = "evaluation"
harness = false

[[test]]
name = "nuts"
required-features = ["nuts"]

[lints]
workspace = true
